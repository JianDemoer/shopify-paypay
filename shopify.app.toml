name = "Omni Checkout"
client_id = "REPLACE_WITH_SHOPIFY_API_KEY"
application_url = "https://REPLACE_WITH_APP_DOMAIN"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_products,read_orders,write_orders,write_draft_orders"

[auth]
redirect_urls = ["https://REPLACE_WITH_APP_DOMAIN/api/auth/shopify/callback"]

[webhooks]
api_version = "2025-10"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/api/webhooks/shopify"

[app_proxy]
url = "https://REPLACE_WITH_APP_DOMAIN/a/s"
prefix = "a"
subpath = "s"
